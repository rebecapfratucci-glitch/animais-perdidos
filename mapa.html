<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa de Animais Perdidos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

:root{
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --border:#dbe2ea;
    --primary:#2563eb;
    --sidebar:#ffffff;
}

[data-theme="dark"]{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --border:#475569;
    --primary:#3b82f6;
    --sidebar:#1e293b;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    transition:.3s;
    overflow:hidden;
}

.navbar-custom{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.main-container{
    display:flex;
    height:calc(100vh - 56px);
}

.sidebar{
    width:380px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    overflow-y:auto;
}

.map-container{
    flex:1;
}

#map{
    height:100%;
    width:100%;
}

.card-animal{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.card-animal:hover{
    transform:translateY(-2px);
}

.card-animal img{
    width:100%;
    max-height:180px;
    object-fit:cover;
    border-radius:8px;
}

.search-box{
    position:sticky;
    top:0;
    background:var(--sidebar);
    padding:15px;
    z-index:100;
    border-bottom:1px solid var(--border);
}

.badge-status{
    font-size:.75rem;
}

.popup-img{
    width:100%;
    max-width:250px;
    border-radius:10px;
    margin-bottom:10px;
}

.loading{
    text-align:center;
    padding:20px;
}

@media(max-width:992px){

    .main-container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:45%;
    }

    .map-container{
        height:55%;
    }

}

</style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">

        <span class="navbar-brand fw-bold">
            🗺️ Mapa de Animais
        </span>

        <div class="d-flex gap-2">

            <a href="mapa.html" class="btn btn-light btn-sm">
                🗺️ Mapa
            </a>

            <a href="cadastro.html" class="btn btn-success btn-sm">
                🐾 Cadastro
            </a>

            <button
                class="btn btn-light btn-sm"
                id="btnRefresh">

                <i class="bi bi-arrow-clockwise"></i>
            </button>

            <button
                class="btn btn-light btn-sm"
                id="toggleTheme">

                🌙
            </button>

        </div>

    </div>
</nav>

<div class="main-container">

    <div class="sidebar">

        <div class="search-box">

            <input
                type="text"
                id="search"
                class="form-control"
                placeholder="Pesquisar animal...">

        </div>

        <div id="listaAnimais" class="p-3">

            <div class="loading">
                Carregando registros...
            </div>

        </div>

    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API_URL =
"https://api-crud-animais-4x2c.onrender.com/animais";

let mapa;
let markers = [];
let animais = [];

mapa = L.map('map').setView(
    [-22.1207,-51.3889],
    12
);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap'
    }
).addTo(mapa);

const cacheGeo = {};

async function geocode(endereco){

    if(cacheGeo[endereco])
        return cacheGeo[endereco];

    try{

        const resp = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}`
        );

        const dados = await resp.json();

        if(dados.length){

            const result = {
                lat:parseFloat(dados[0].lat),
                lon:parseFloat(dados[0].lon)
            };

            cacheGeo[endereco] = result;

            return result;
        }

    }catch(err){
        console.error(err);
    }

    return null;
}

async function carregarAnimais(){

    document.getElementById("listaAnimais").innerHTML =
    `<div class="loading">Carregando registros...</div>`;

    markers.forEach(m => mapa.removeLayer(m));
    markers = [];

    try{

        const resp = await fetch(API_URL);

        const dados = await resp.json();

        animais = dados.filter(a =>
            (a.status || "").toLowerCase() !== "finalizado"
        );

        renderLista(animais);

        for(const animal of animais){

            const geo =
                await geocode(animal.localizacao);

            if(!geo) continue;

            const marker = L.marker([
                geo.lat,
                geo.lon
            ]).addTo(mapa);

            marker.bindPopup(`
                <div style="width:250px">

                ${
                    animal.foto
                    ? `<img src="${animal.foto}" class="popup-img">`
                    : ''
                }

                <h6>${animal.tipo}</h6>

                <span class="badge bg-danger">
                    ${animal.status}
                </span>

                <hr>

                <p>
                    ${animal.descricao || ''}
                </p>

                <p>
                    <b>Contato:</b><br>
                    ${animal.nome_contato || ''}
                </p>

                <p>
                    📞 ${animal.telefone_contato || ''}
                </p>

                <p>
                    ✉️ ${animal.email_contato || ''}
                </p>

                </div>
            `);

            marker.animal = animal;

            markers.push(marker);
        }

    }catch(error){

        document.getElementById("listaAnimais").innerHTML =
        `
        <div class="alert alert-danger">
            Erro ao carregar registros.
        </div>
        `;

        console.error(error);

    }

}

function renderLista(lista){

    const container =
        document.getElementById("listaAnimais");

    container.innerHTML = "";

    if(!lista.length){

        container.innerHTML =
        `
        <div class="alert alert-warning">
            Nenhum registro encontrado.
        </div>
        `;

        return;
    }

    lista.forEach((animal,index)=>{

        const div =
            document.createElement("div");

        div.className = "card-animal";

        div.innerHTML = `

            ${
                animal.foto
                ? `<img src="${animal.foto}">`
                : ''
            }

            <h6 class="mt-2">
                ${animal.tipo}
            </h6>

            <span class="badge bg-primary badge-status">
                ${animal.status}
            </span>

            <p class="small mt-2 mb-1">
                ${animal.descricao || ''}
            </p>

            <small>
                ${animal.localizacao || ''}
            </small>
        `;

        div.addEventListener("click", async ()=>{

            const geo =
                await geocode(
                    animal.localizacao
                );

            if(!geo) return;

            mapa.setView(
                [geo.lat,geo.lon],
                17
            );

            markers[index]?.openPopup();

        });

        container.appendChild(div);

    });

}

document
.getElementById("search")
.addEventListener("input", function(){

    const termo =
        this.value.toLowerCase();

    const filtrados =
        animais.filter(a =>

            JSON.stringify(a)
            .toLowerCase()
            .includes(termo)

        );

    renderLista(filtrados);

});

document
.getElementById("btnRefresh")
.addEventListener(
    "click",
    carregarAnimais
);

const btnTheme =
document.getElementById("toggleTheme");

btnTheme.addEventListener("click", ()=>{

    const html =
        document.documentElement;

    if(html.dataset.theme==="light"){

        html.dataset.theme="dark";
        btnTheme.innerHTML="☀️";

    }else{

        html.dataset.theme="light";
        btnTheme.innerHTML="🌙";

    }

});

carregarAnimais();

</script>

</body>
</html>
