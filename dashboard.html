<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Gestão de Animais</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --border:#dbe2ea;
    --shadow:0 10px 25px rgba(0,0,0,.08);
}

[data-theme="dark"]{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --border:#334155;
    --shadow:0 10px 25px rgba(0,0,0,.35);
}

body{
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}

.navbar-custom{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.card-dashboard{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
    height:100%;
}

.kpi{
    font-size:2rem;
    font-weight:700;
}

.chart-container{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
    height:100%;
}

.table-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
}

.table{
    color:inherit;
}

[data-theme="dark"] .form-control,
[data-theme="dark"] .form-select{
    background:#273449;
    color:white;
    border-color:#475569;
}

canvas{
    max-height:350px;
}

.badge-status{
    font-size:.8rem;
}

</style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">

        <span class="navbar-brand fw-bold">
            📊 Dashboard de Animais
        </span>

        <div class="d-flex gap-2">

            <a href="mapa.html" class="btn btn-light btn-sm">
                🗺️ Mapa
            </a>

            <a href="cadastro.html" class="btn btn-success btn-sm">
                🐾 Cadastro
            </a>

            <button class="btn btn-light btn-sm" id="btnAtualizar">
                <i class="bi bi-arrow-clockwise"></i>
            </button>

            <button class="btn btn-light btn-sm" id="toggleTheme">
                🌙
            </button>

        </div>

    </div>
</nav>

<div class="container-fluid p-4">

    <div class="row g-4 mb-4">

        <div class="col-md-2">
            <div class="card-dashboard">
                <div>Total</div>
                <div class="kpi" id="totalRegistros">0</div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card-dashboard">
                <div>Perdidos</div>
                <div class="kpi text-danger" id="totalPerdidos">0</div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card-dashboard">
                <div>Encontrados</div>
                <div class="kpi text-success" id="totalEncontrados">0</div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card-dashboard">
                <div>Adoção</div>
                <div class="kpi text-primary" id="totalAdocao">0</div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card-dashboard">
                <div>Finalizados</div>
                <div class="kpi text-secondary" id="totalFinalizados">0</div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card-dashboard">
                <div>Taxa Resolução</div>
                <div class="kpi" id="taxaResolucao">0%</div>
            </div>
        </div>

    </div>

    <div class="row g-4">

        <div class="col-lg-6">
            <div class="chart-container">
                <h5>Status</h5>
                <canvas id="chartStatus"></canvas>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="chart-container">
                <h5>Tipos</h5>
                <canvas id="chartTipos"></canvas>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="chart-container">
                <h5>Resolvidos x Pendentes</h5>
                <canvas id="chartResolucao"></canvas>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="chart-container">
                <h5>Cadastros por Dia</h5>
                <canvas id="chartDatas"></canvas>
            </div>
        </div>

    </div>

    <div class="table-card mt-4">

        <div class="row mb-3">

            <div class="col-md-4">
                <input
                    type="text"
                    id="busca"
                    class="form-control"
                    placeholder="Pesquisar..."
                >
            </div>

            <div class="col-md-3">
                <select id="filtroStatus" class="form-select">
                    <option value="">Todos</option>
                    <option value="perdido">Perdido</option>
                    <option value="encontrado">Encontrado</option>
                    <option value="para adoção">Para Adoção</option>
                    <option value="finalizado">Finalizado</option>
                </select>
            </div>

        </div>

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Status</th>
                        <th>Descrição</th>
                        <th>Contato</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaAnimais"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

const API =
'https://api-crud-animais-4x2c.onrender.com/animais';

let animais = [];

let chartStatus;
let chartTipos;
let chartResolucao;
let chartDatas;

async function carregarDados(){

    const resp = await fetch(API);

    animais = await resp.json();

    atualizarKPIs();
    atualizarGraficos();
    renderTabela();

}

function atualizarKPIs(){

    const total = animais.length;

    const perdidos =
        animais.filter(a=>a.status==="perdido").length;

    const encontrados =
        animais.filter(a=>a.status==="encontrado").length;

    const adocao =
        animais.filter(a=>
            (a.status||'').toLowerCase().includes('ado')
        ).length;

    const finalizados =
        animais.filter(a=>a.status==="finalizado").length;

    document.getElementById("totalRegistros").innerText = total;
    document.getElementById("totalPerdidos").innerText = perdidos;
    document.getElementById("totalEncontrados").innerText = encontrados;
    document.getElementById("totalAdocao").innerText = adocao;
    document.getElementById("totalFinalizados").innerText = finalizados;

    document.getElementById("taxaResolucao").innerText =
        total ? ((finalizados/total)*100).toFixed(1)+'%' : '0%';

}

function destruirGraficos(){

    chartStatus?.destroy();
    chartTipos?.destroy();
    chartResolucao?.destroy();
    chartDatas?.destroy();

}

function atualizarGraficos(){

    destruirGraficos();

    const statusCount = {};

    animais.forEach(a=>{
        statusCount[a.status] =
            (statusCount[a.status]||0)+1;
    });

    chartStatus = new Chart(
        document.getElementById("chartStatus"),
        {
            type:'pie',
            data:{
                labels:Object.keys(statusCount),
                datasets:[{
                    data:Object.values(statusCount)
                }]
            }
        }
    );

    const tipoCount = {};

    animais.forEach(a=>{
        tipoCount[a.tipo] =
            (tipoCount[a.tipo]||0)+1;
    });

    chartTipos = new Chart(
        document.getElementById("chartTipos"),
        {
            type:'bar',
            data:{
                labels:Object.keys(tipoCount),
                datasets:[{
                    label:'Quantidade',
                    data:Object.values(tipoCount)
                }]
            }
        }
    );

    const finalizados =
        animais.filter(a=>a.status==="finalizado").length;

    const pendentes =
        animais.length-finalizados;

    chartResolucao = new Chart(
        document.getElementById("chartResolucao"),
        {
            type:'doughnut',
            data:{
                labels:['Finalizados','Pendentes'],
                datasets:[{
                    data:[finalizados,pendentes]
                }]
            }
        }
    );

    const datas = {};

    animais.forEach(a=>{

        if(a.data_registro){

            const dia =
                a.data_registro.substring(0,10);

            datas[dia]=(datas[dia]||0)+1;

        }

    });

    chartDatas = new Chart(
        document.getElementById("chartDatas"),
        {
            type:'line',
            data:{
                labels:Object.keys(datas),
                datasets:[{
                    label:'Cadastros',
                    data:Object.values(datas)
                }]
            }
        }
    );

}

function renderTabela(){

    const busca =
        document.getElementById("busca")
        .value
        .toLowerCase();

    const filtro =
        document.getElementById("filtroStatus")
        .value;

    const tbody =
        document.getElementById("tabelaAnimais");

    tbody.innerHTML = '';

    animais
    .filter(a=>{

        const texto =
            JSON.stringify(a)
            .toLowerCase();

        const matchBusca =
            texto.includes(busca);

        const matchStatus =
            !filtro ||
            a.status===filtro;

        return matchBusca && matchStatus;

    })
    .forEach(animal=>{

        tbody.innerHTML += `
        <tr>

            <td>${animal.id}</td>

            <td>${animal.tipo}</td>

            <td>
                <span class="badge bg-primary badge-status">
                    ${animal.status}
                </span>
            </td>

            <td>${animal.descricao||''}</td>

            <td>
                ${animal.nome_contato||''}
            </td>

            <td>

                ${
                    animal.status !== 'finalizado'
                    ?
                    `
                    <button
                        class="btn btn-success btn-sm"
                        onclick="finalizar(${animal.id})">

                        Finalizar

                    </button>
                    `
                    : ''
                }

                <button
                    class="btn btn-danger btn-sm"
                    onclick="excluir(${animal.id})">

                    Excluir

                </button>

            </td>

        </tr>
        `;

    });

}

async function finalizar(id){

    if(!confirm('Finalizar registro?'))
        return;

    const animal =
        animais.find(a=>a.id===id);

    if(!animal)
        return;

    const payload = {
        ...animal,
        status:'finalizado'
    };

    delete payload.id;

    try{

        await fetch(`${API}/${id}`,{
            method:'PUT',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify(payload)
        });

        carregarDados();

    }catch(err){

        alert('Erro ao finalizar.');

    }

}

async function excluir(id){

    if(!confirm('Deseja excluir?'))
        return;

    try{

        await fetch(`${API}/${id}`,{
            method:'DELETE'
        });

        carregarDados();

    }catch(err){

        alert('Erro ao excluir.');

    }

}

document
.getElementById("busca")
.addEventListener(
    "input",
    renderTabela
);

document
.getElementById("filtroStatus")
.addEventListener(
    "change",
    renderTabela
);

document
.getElementById("btnAtualizar")
.addEventListener(
    "click",
    carregarDados
);

const btnTheme =
document.getElementById("toggleTheme");

btnTheme.addEventListener("click",()=>{

    const html =
        document.documentElement;

    if(html.dataset.theme==="light"){

        html.dataset.theme="dark";
        btnTheme.innerHTML="☀️";

    }else{

        html.dataset.theme="light";
        btnTheme.innerHTML="🌙";

    }

});

carregarDados();

</script>

</body>
</html>
