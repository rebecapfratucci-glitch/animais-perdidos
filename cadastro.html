<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Animais - Perdidos, Encontrados e Adoção</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root{
    --bg:#f1f5f9;
    --card:#ffffff;
    --card-hover:#f8fafc;
    --text:#0f172a;
    --text-muted:#64748b;
    --border:#cbd5e1;
    --primary:#2563eb;
    --primary-hover:#1d4ed8;
    --success:#16a34a;
    --shadow:0 10px 30px rgba(0,0,0,.08);
}

[data-theme="dark"]{
    --bg:#0f172a;
    --card:#1e293b;
    --card-hover:#334155;
    --text:#f8fafc;
    --text-muted:#cbd5e1;
    --border:#475569;
    --primary:#3b82f6;
    --primary-hover:#60a5fa;
    --success:#22c55e;
    --shadow:0 10px 30px rgba(0,0,0,.35);
}

body{
    background:var(--bg);
    color:var(--text);
    transition:.3s;
    min-height:100vh;
}

.navbar-custom{
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-hover)
    );
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:20px;
}

.card:hover{
    background:var(--card-hover);
}

.form-label{
    font-weight:600;
    color:var(--text);
}

.form-control,
.form-select{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    min-height:48px;
}

.form-control::placeholder{
    color:var(--text-muted);
}

.form-control:focus,
.form-select:focus{
    background:var(--card);
    color:var(--text);
    border-color:var(--primary);
    box-shadow:0 0 0 .25rem rgba(37,99,235,.20);
}

[data-theme="dark"] .form-control,
[data-theme="dark"] .form-select{
    background:#273449;
    color:#fff;
}

[data-theme="dark"] .form-control::placeholder{
    color:#b8c1cc;
}

.btn-primary{
    background:var(--primary);
    border:none;
}

.btn-primary:hover{
    background:var(--primary-hover);
}

.btn-success{
    border:none;
}

.text-muted{
    color:var(--text-muted) !important;
}

hr{
    border-color:var(--border);
}

#map{
    height:400px;
    border-radius:16px;
    overflow:hidden;
    border:2px solid var(--border);
    box-shadow:var(--shadow);
}

.preview-img{
    max-width:250px;
    border-radius:12px;
    border:3px solid var(--border);
    display:none;
    margin-top:10px;
}

.footer{
    color:var(--text-muted);
    padding:20px;
}

.alert-success{
    border:none;
    box-shadow:var(--shadow);
}

.alert-danger{
    border:none;
    box-shadow:var(--shadow);
}

.badge-api{
    font-size:.85rem;
    padding:.5rem .8rem;
}

h3,
h5{
    color:var(--text);
    font-weight:700;
}

.leaflet-container{
    background:#dbeafe;
}
</style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-heart-pulse-fill"></i>
            Cadastro de Animais
        </span>

        <button class="btn btn-light" id="toggleTheme">
            <i class="bi bi-moon-stars"></i>
        </button>
    </div>
</nav>

<div class="container py-4">

    <div class="card shadow-lg">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0">
                    🐾 Registro de Animal
                </h3>
            </div>

            <p class="text-muted">
                Registre animais perdidos, encontrados ou disponíveis para adoção.
            </p>

            <form id="animalForm">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Tipo *</label>
                        <select class="form-select" id="tipo" required>
                            <option value="">Selecione</option>
                            <option value="cachorro">Cachorro</option>
                            <option value="gato">Gato</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status *</label>
                        <select class="form-select" id="status" required>
                            <option value="">Selecione</option>
                            <option value="perdido">Perdido</option>
                            <option value="encontrado">Encontrado</option>
                            <option value="para adoção">Para Adoção</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Descrição *</label>
                        <textarea
                            class="form-control"
                            rows="4"
                            id="descricao"
                            required
                            placeholder="Descreva o animal"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nome para contato *</label>
                        <input
                            type="text"
                            class="form-control"
                            id="nome_contato"
                            required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Telefone *</label>
                        <input
                            type="text"
                            class="form-control"
                            id="telefone_contato"
                            required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">E-mail *</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email_contato"
                            required>
                    </div>

                </div>

                <hr class="my-4">

                <h5>
                    <i class="bi bi-geo-alt-fill"></i>
                    Localização
                </h5>

                <div class="row g-3 mb-3">

                    <div class="col-md-8">
                        <input
                            type="text"
                            id="enderecoBusca"
                            class="form-control"
                            placeholder="Digite um endereço para localizar">
                    </div>

                    <div class="col-md-2 d-grid">
                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="buscarEndereco()">
                            Buscar
                        </button>
                    </div>

                    <div class="col-md-2 d-grid">
                        <button
                            type="button"
                            class="btn btn-success"
                            onclick="usarLocalizacaoAtual()">
                            Minha Localização
                        </button>
                    </div>

                </div>

                <div id="map"></div>

                <div class="mt-3">
                    <label class="form-label">
                        Localização Selecionada *
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="localizacao"
                        readonly
                        required>
                </div>

                <hr class="my-4">

                <h5>
                    <i class="bi bi-camera-fill"></i>
                    Foto do Animal (Opcional)
                </h5>

                <input
                    type="file"
                    class="form-control"
                    id="foto"
                    accept="image/*">

                <img
                    id="preview"
                    class="preview-img">

                <hr class="my-4">

                <div class="d-grid">
                    <button
                        type="submit"
                        class="btn btn-lg btn-primary">

                        <span class="loading spinner-border spinner-border-sm me-2"></span>

                        Salvar Cadastro
                    </button>
                </div>

            </form>

        </div>
    </div>

    <div id="resultado" class="mt-4"></div>

    <div class="footer">
        Desenvolvido com Bootstrap + OpenStreetMap + API CRUD Animais
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API_URL = "https://api-crud-animais-4x2c.onrender.com";

let mapa;
let marcador;
let fotoBase64 = "";


// ======================
// Tema
// ======================

const btnTheme = document.getElementById("toggleTheme");

btnTheme.addEventListener("click", () => {

    const html = document.documentElement;

    if(html.dataset.theme === "light"){
        html.dataset.theme = "dark";
        localStorage.setItem("theme","dark");
        btnTheme.innerHTML = '<i class="bi bi-sun"></i>';
    }else{
        html.dataset.theme = "light";
        localStorage.setItem("theme","light");
        btnTheme.innerHTML = '<i class="bi bi-moon-stars"></i>';
    }

});

const temaSalvo = localStorage.getItem("theme");

if(temaSalvo){
    document.documentElement.dataset.theme = temaSalvo;
}

// ======================
// Mapa
// ======================

mapa = L.map('map').setView([-22.1207, -51.3889], 13);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap'
    }
).addTo(mapa);

marcador = L.marker([-22.1207,-51.3889], {
    draggable:true
}).addTo(mapa);

atualizarEndereco(-22.1207,-51.3889);

marcador.on('dragend', function(){

    const pos = marcador.getLatLng();

    atualizarEndereco(pos.lat,pos.lng);

});

mapa.on("click", function(e){

    marcador.setLatLng(e.latlng);

    atualizarEndereco(
        e.latlng.lat,
        e.latlng.lng
    );

});

// ======================
// Geocoder
// ======================

async function atualizarEndereco(lat,lon){

    try{

        const resp = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
        );

        const dados = await resp.json();

        document.getElementById("localizacao").value =
            dados.display_name || `${lat},${lon}`;

    }catch{

        document.getElementById("localizacao").value =
            `${lat},${lon}`;

    }

}

async function buscarEndereco(){

    const endereco =
        document.getElementById("enderecoBusca").value;

    if(!endereco) return;

    const resp = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}`
    );

    const dados = await resp.json();

    if(!dados.length){

        alert("Endereço não encontrado.");
        return;

    }

    const lat = parseFloat(dados[0].lat);
    const lon = parseFloat(dados[0].lon);

    mapa.setView([lat,lon],16);

    marcador.setLatLng([lat,lon]);

    atualizarEndereco(lat,lon);

}

function usarLocalizacaoAtual(){

    navigator.geolocation.getCurrentPosition(

        (pos)=>{

            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            mapa.setView([lat,lon],16);

            marcador.setLatLng([lat,lon]);

            atualizarEndereco(lat,lon);

        },

        ()=>{
            alert("Não foi possível obter sua localização.");
        }

    );

}

// ======================
// Upload imagem
// ======================

document
.getElementById("foto")
.addEventListener("change", function(e){

    const arquivo = e.target.files[0];

    if(!arquivo){

        fotoBase64 = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event){

        fotoBase64 = event.target.result;

        const preview =
            document.getElementById("preview");

        preview.src = fotoBase64;
        preview.style.display = "block";
    };

    reader.readAsDataURL(arquivo);

});

// ======================
// Cadastro
// ======================

document
.getElementById("animalForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const loading =
        document.querySelector(".loading");

    loading.style.display = "inline-block";

    const payload = {

        tipo:
            document.getElementById("tipo").value,

        status:
            document.getElementById("status").value,

        descricao:
            document.getElementById("descricao").value,

        localizacao:
            document.getElementById("localizacao").value,

        foto:
            fotoBase64 || "",

        nome_contato:
            document.getElementById("nome_contato").value,

        telefone_contato:
            document.getElementById("telefone_contato").value,

        email_contato:
            document.getElementById("email_contato").value

    };

    try{

        const response = await fetch(
            `${API_URL}/animais`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(payload)
            }
        );

        if(!response.ok){
            throw new Error();
        }

        document.getElementById("resultado").innerHTML =
        `
        <div class="alert alert-success">
            ✅ Cadastro realizado com sucesso!
        </div>
        `;

        document.getElementById("animalForm").reset();

        document.getElementById("preview").style.display =
            "none";

        fotoBase64 = "";

    }catch(error){

        document.getElementById("resultado").innerHTML =
        `
        <div class="alert alert-danger">
            ❌ Erro ao enviar cadastro para a API.
        </div>
        `;

        console.error(error);

    }finally{

        loading.style.display = "none";

    }

});
</script>

</body>
</html>
